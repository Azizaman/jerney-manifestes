apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jerney-ingress
spec:
  ingressClassName: nginx

  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jerney-frontend-svc
                port:
                  number: 80