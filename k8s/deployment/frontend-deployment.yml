apiVersion: apps/v1
kind: Deployment
metadata:
  name: jerney-frontend
  namespace: frontend
  labels:
    type: frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      type: frontend

  template:
    metadata:
      labels:
        type: frontend

    spec:
      containers:
        - name: jerney-frontend
          image: azizaman/jerney-frontend:3.0.0

          ports:
            - containerPort: 80   # 👈 assuming nginx build

          env:
            - name: API_URL
              value: http://jerney-backend-svc.backend.svc.cluster.local:5000

          resources:
            requests:
              cpu: 100m
              memory: "200Mi"
            limits:
              cpu: 500m
              memory: "500Mi"

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10

          startupProbe:
            httpGet:
              path: /
              port: 80
            failureThreshold: 30
            periodSeconds: 5