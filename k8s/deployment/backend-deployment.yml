apiVersion: apps/v1
kind: Deployment
metadata:
  name: jerney-backend
  namespace: backend
  labels:
    type: backend

spec:
  replicas: 2
  selector:
    matchLabels:
      type: backend

  template:
    metadata:
      labels:
        type: backend

    spec:
      containers:
        - name: jerney-backend
          image: azizaman/jerney-backend:2.0.0
          ports:
            - containerPort: 5000

          env:
            # 🔥 DB CONNECTION
            - name: DB_HOST
              value: postgres   # 👈 this is your K8s service name

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

          resources:
            requests:
              cpu: 100m
              memory: "500Mi"
            limits:
              cpu: 1
              memory: "1Gi"

          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 20

          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 20

          startupProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            failureThreshold: 30
            periodSeconds: 5